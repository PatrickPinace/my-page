# Wdrożenie na współdzielonym VPS (ronim.com.pl), wzorem
# bdo-filler-demo/compose.demo.vps.yml: podłączenie do istniejącej
# zewnętrznej sieci core-network zamiast publikowania portów na hosta
# (Caddy jest jedynym reverse proxy, patrz /opt/core/caddy/Caddyfile),
# jawny container_name (core-network jest współdzielona między wieloma
# projektami Compose, same nazwy serwisów nie wystarczają do DNS bez
# kolizji).
#
# Uruchom (na VPS, w /opt/apps/my-page/app/):
#   docker compose -f compose.vps.yml up -d --build
#
# `name:` jawnie ustawiony -- inaczej Compose nazywa projekt po nazwie
# katalogu roboczego, a ten katalog (jak w innych projektach na tym
# hoście, np. bdo-filler-demo/app) nazywa się "app". Bez jawnej nazwy
# dwa niezwiązane projekty Compose na tym samym VPS-ie dzielą jedną
# nazwę projektu "app" i każdy kolejny `up` jednego z nich usuwa
# (Recreate) kontenery tego drugiego, którego serwisy nie są w bieżącym
# pliku compose -- to realnie się wydarzyło przy pierwszym deployu tego
# projektu i skasowało kontener bdo-filler-demo-frontend.
name: my-page
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-page-frontend
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - core-network
    expose:
      - "80"

networks:
  core-network:
    external: true
