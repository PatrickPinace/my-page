# Wdrożenie na VPS (ronim.com.pl) - strona statyczna, bez backendu.
# Caddy centralny (/opt/core/caddy/Caddyfile) jest jedynym reverse proxy
# na hoście i doprowadza ruch tutaj przez container_name (core-network
# jest współdzielona między wieloma projektami Compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
