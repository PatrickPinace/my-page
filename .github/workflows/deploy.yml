name: Deploy na VPS

# Uruchamiany wyłącznie ręcznie (Actions → Deploy na VPS → Run workflow),
# dopóki VPS nie jest gotowy i sekrety nie są ustawione. Żeby wrócić do
# automatu przy każdym pushu, odkomentuj poniższe `push:`.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zainstaluj pnpm
        uses: pnpm/action-setup@v4
        with:
          # ta sama wersja co lokalnie — lockfile jest nią wygenerowany,
          # a --frozen-lockfile potrafi się wywrócić przy innej
          version: 11.5.1
          run_install: false

      - name: Zainstaluj Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile

      - name: Zbuduj stronę
        run: pnpm build
        env:
          # Pełny adres strony — trafia do sitemap i tagów kanonicznych.
          # Ustaw w ustawieniach repo: Settings → Secrets and variables →
          # Actions → Variables, np. https://minor.pl
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Zweryfikuj build
        run: |
          test -f dist/index.html || { echo "Brak dist/index.html — build nie wyszedł"; exit 1; }
          echo "Zbudowane strony:"; find dist -name '*.html' | sort

      - name: Wgraj klucz SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Dodaj VPS do known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

      - name: Wyślij dist/ na serwer
        run: |
          # --delete usuwa ze zdalnego katalogu pliki, których już nie ma
          # w buildzie. Ścieżka docelowa MUSI wskazywać wyłącznie na katalog
          # tej strony — rsync wyczyści wszystko, co jest w środku.
          rsync -avz --delete \
            -e "ssh -p ${VPS_PORT:-22}" \
            dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
