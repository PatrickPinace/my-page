name: Deploy na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zainstaluj pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Zainstaluj Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile

      - name: Zbuduj stronę
        run: pnpm build
        env:
          SITE_URL: https://michal.ronim.com.pl

      - name: Zweryfikuj build
        run: |
          test -f dist/index.html || { echo "Brak dist/index.html - build nie wyszedł"; exit 1; }
          echo "Zbudowane strony:"; find dist -name '*.html' | sort

      - name: Wgraj klucz SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Dodaj VPS do known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

      - name: Uruchom deploy na serwerze
        run: |
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "$VPS_DEPLOY_PATH/deploy.sh"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
